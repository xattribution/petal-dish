# SIMULATED scenario for config/pacific-uhf.yaml: pacific-demo with a clock fault.
name: clock-fault
seed: 1
description: >-
  Simulated scenario (not real data): pacific-demo (the same open-ocean noise jammer at
  20 N 132 E, 10 kHz at 301.005 MHz, 20 dBW, the same reference carriers and small
  truth errors) with one fault added: the Naha site clock runs 10 microseconds late
  (as if its timing receiver had lost lock hours ago). Every TDOA between Naha and
  another site is then off by 10 microseconds, 3 km of range difference. The server's
  tasking normally uses Naha: naha-172e is the best 172 E channel, so it is either the
  primary channel or the partner of the primary (Honolulu) for 172 E. The operator
  should see the event detected and judged uplink as in pacific-demo. Without
  calibration the fix then lands 14 to 40 km from the truth, outside its own 95 %
  ellipse (5.5 to 16 km by 0.7 to 0.8 km; NEES 39 to 42), and the fit gives no warning
  (reduced chi-square 0.14 to 0.15, because only the two TDOA rows constrain the
  position); near 12 UTC the geometry degenerates (an ellipse 1,700 km long, which the
  server shows as not a fix) and the fix is 450 km off, and near 21 UTC, when the two TDOA hyperbolas cross twice, it shows two
  unresolved candidates, neither near the truth (the nearer about 185 km off). The
  reference-carrier calibration, measured through the same two sites, carries the same
  10 microseconds and removes them: the calibrated fix is 30 to 220 m from the truth,
  inside its 95 % ellipse (0.45 to 0.61 km by 0.24 to 0.26 km), as in pacific-demo. When
  the strongest detection happens to be on a Seoul channel (near 09 UTC), every pair is
  formed at Seoul, the site clocks cancel in every TDOA, and the fault has no effect at
  all; the server's partner rotation still brings cross-site pairs in every other round.
  Measured with the server's chain (tests/test_sim_verify.py) at eight times of day on
  2026-01-01. The calibrations and same-satellite clock checks also put Naha's clock
  about 10 microseconds late on the Network screen, with a caution saying the
  calibrations through two satellites agree (within about 20 s of the first rounds in a
  live demo from 2026-11-13T03:00:00Z).
emitters:
  - id: jammer-philsea
    name: Uplink noise jammer (simulated, open ocean)
    kind: jammer
    lat_deg: 20.0
    lon_deg: 132.0
    alt_m: 0.0
    antenna_height_m: 10.0
    freq_hz: 301.005e+6
    eirp_dbw: 20.0
    antenna: {type: isotropic}
    pointing: omni
    waveform: {type: noise, bandwidth_hz: 10.0e+3, seed: 0}
errors:
  ephemeris:
    muos-pac: {ric_pos_m: [60.0, -700.0, 400.0], ric_vel_mps: [0.0, 0.0, 0.0]}
    uhf-172e: {ric_pos_m: [-40.0, 500.0, -800.0], ric_vel_mps: [0.0, 0.0, 0.0]}
    muos-io: {ric_pos_m: [80.0, 900.0, 300.0], ric_vel_mps: [0.0, 0.0, 0.0]}
  sat_osc_frac: {muos-pac: 4.0e-7, uhf-172e: -3.0e-7, muos-io: 2.5e-7}
  site_clock_offset_ns: {tokyo: 40.0, naha: 10000.0}
  site_osc_frac: {honolulu: 5.0e-12, manila: -8.0e-12}
