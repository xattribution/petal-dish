# SIMULATED scenario for config/pacific-uhf.yaml. Fictional open-ocean positions.
name: two-jammers
seed: 5
description: >-
  Simulated scenario (not real data): two uplink noise jammers at once, on different
  channels and at fictional open-ocean points. The first (Philippine Sea, 20 N 132 E)
  radiates 10 kHz at 301.005 MHz in shared-1, 20 dBW; the second (Shikoku Basin,
  30 N 135 E) radiates 8 kHz at 301.130 MHz in shared-2, clear of the Sapporo reference
  carrier, 18 dBW. Both are relayed by all three satellites. The operator should see two
  separate events, one per channel (shared-1 at 52 to 56 dB-Hz, shared-2 at 49 to
  54 dB-Hz on every channel), each with an uplink verdict, its own correlations far above
  threshold (about 40 and 39 dB post-correlation SNR) and its own located position near
  the true one, without the two being merged. Truth errors are the small ones of pacific-demo.
emitters:
  - id: jammer-a
    name: Uplink noise jammer A (simulated, open ocean)
    kind: jammer
    lat_deg: 20.0
    lon_deg: 132.0
    freq_hz: 301.005e+6
    eirp_dbw: 20.0
    waveform: {type: noise, bandwidth_hz: 10.0e+3, seed: 0}
  - id: jammer-b
    name: Uplink noise jammer B (simulated, open ocean)
    kind: jammer
    lat_deg: 30.0
    lon_deg: 135.0
    freq_hz: 301.130e+6
    eirp_dbw: 18.0
    waveform: {type: noise, bandwidth_hz: 8.0e+3, seed: 1}
errors:
  ephemeris:
    muos-pac: {ric_pos_m: [60.0, -700.0, 400.0], ric_vel_mps: [0.0, 0.0, 0.0]}
    uhf-172e: {ric_pos_m: [-40.0, 500.0, -800.0], ric_vel_mps: [0.0, 0.0, 0.0]}
    muos-io: {ric_pos_m: [80.0, 900.0, 300.0], ric_vel_mps: [0.0, 0.0, 0.0]}
  sat_osc_frac: {muos-pac: 4.0e-7, uhf-172e: -3.0e-7, muos-io: 2.5e-7}
  site_clock_offset_ns: {tokyo: 40.0}
