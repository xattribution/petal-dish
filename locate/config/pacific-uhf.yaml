    orbit: {type: geo, lon_deg: 75.0, inclination_deg: 5.0, phase_deg: 310.0, epoch: "2026-01-01T00:00:00Z"}
    transponders:
      - {id: shared-1, uplink_center_hz: 301.000e+6, bandwidth_hz: 25.0e+3, translation_hz: -41.0e+6,
