# Reference carriers: narrow (5 kHz) carriers at known city-centre locations, each
# parked 7.5 kHz below the centre of one of the shared channels and radiated from a
# modest 10 dBi beam antenna (13 dBW EIRP, 15 dB front-to-back) aimed at its assigned
# satellite. The other satellites receive them through the side and back of that beam,
# 15 dB down at worst, which still correlates well over a one-second capture. Powers,
# antennas and frequencies are illustrative.
carriers:
  - id: ref-guam
    name: Reference carrier, Guam city centre (illustrative)
    satellite_id: muos-io
    transponder_id: shared-1
    uplink_center_hz: 300.9925e+6
    bandwidth_hz: 5.0e+3
    location: {lat_deg: 13.476, lon_deg: 144.749, alt_m: 0.0, antenna_height_m: 10.0}
    emitter:
      eirp_dbw: 13.0
      antenna: {type: beam, gain_dbi: 10.0, hpbw_deg: 52.0, front_to_back_db: 15.0}
      pointing: {satellite_id: muos-io}
      bandwidth_hz: 5.0e+3
      waveform: noise
    use_as_reference: true

  - id: ref-sapporo
    name: Reference carrier, Sapporo city centre (illustrative)
    satellite_id: uhf-172e
    transponder_id: shared-2
    uplink_center_hz: 301.1175e+6
    bandwidth_hz: 5.0e+3
    location: {lat_deg: 43.062, lon_deg: 141.354, alt_m: 0.0, antenna_height_m: 10.0}
    emitter:
      eirp_dbw: 13.0
      antenna: {type: beam, gain_dbi: 10.0, hpbw_deg: 52.0, front_to_back_db: 15.0}
      pointing: {satellite_id: uhf-172e}
      bandwidth_hz: 5.0e+3
      waveform: noise
    use_as_reference: true

processing:
  region: {lat_min: -60.0, lat_max: 60.0, lon_min: 60.0, lon_max: -120.0}   # wraps the antimeridian
