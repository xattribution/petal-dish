# Reference carriers (calibration). A reference calibrates a pair of satellites only if
# BOTH satellites relay it well: its own TDOA/FDOA noise goes straight into every
# calibrated row, so it must be small next to the satellite-position error it removes
# (about 1 to 3 microseconds of TDOA for the operator-grade 1 km sigmas, 20 to 70 for
# TLE-grade). Design, all illustrative:
# - Antenna: omnidirectional (modelled as isotropic, 0 dBi; a turnstile or quadrifilar
#   helix over a ground plane), so every satellite above the horizon gets the full
#   EIRP. An earlier design aimed a 10 dBi beam at one satellite; the other two then
#   heard it only through the back of the beam (15 dB down), and its TDOA noise of
#   2 to 4 microseconds made calibrated fixes worse than uncalibrated ones.
# - EIRP 20 dBW (100 W into the omni): 51 to 56 dB-Hz at every channel (link budget,
#   03 to 21 UTC), like the demo jammer, while each shared transponder stays 6 to 7 dB
#   below saturation with the reference alone (3.3 to 4 dB with a 20 dBW jammer
#   alongside). Much more would saturate the transponder and rob the very signals it is
#   meant to calibrate (in an ephemeris-dominated test map near Guam the calibrated
#   ellipse is at worst 0.15 of the uncalibrated one at 20 or 30 dBW, but 0.38 at 40 dBW).
# - Bandwidth 8 kHz of noise-like modulation, parked at the low edge of a shared channel
#   (7.5 kHz below its centre, 1 kHz inside the passband edge), leaving the upper
#   16.5 kHz to users. TDOA precision grows as bandwidth^1.5, so 8 kHz instead of 5 kHz
#   halves the reference noise: predicted 110 to 120 ns per one-second reference capture
#   (core.accuracy at 20 N 132 E, both demo pairs); the correlator measures 110 to 160 ns
#   (the higher where a channel also hears a co-channel copy), about the noise of the
#   target itself (90 to 120 ns), against 2 to 4 microseconds with the old beam design.
# - Placement: one reference per shared channel (a reference only calibrates pairs on its
#   own transponders), at two generic city centres that bracket the region north-south
#   and see all three satellites: Guam (muos-pac 41-45 deg elevation, uhf-172e 52-57,
#   muos-io 10-12) and Sapporo (21-30, 28-35 and 5-12 deg; muos-io is low from there,
#   so a real site would need a clear western horizon). With operator-grade ephemeris
#   calibration shrinks the predicted 95 % error ellipse at the representative points of
#   docs/RESULTS.md from 4 to 6 km to 0.4 to 1 km (03 UTC; 0.2 to 1.8 km over the day),
#   and the simulated miss from about 1.3 to 2 km to 140 to 280 m (median, Monte Carlo);
#   near Hawaii, which only two satellites see, it is what makes a fix possible at all.
#   With TLE-grade ephemeris the residual grows with the distance between the emitter and
#   the reference (1 km at 300 km, 9 to 24 km at 3,000 km); docs/RESULTS.md gives the gain
#   from more reference sites.
carriers:
  - id: ref-guam
    name: Reference carrier, Guam city centre (illustrative)
    satellite_id: muos-io
    transponder_id: shared-1
    uplink_center_hz: 300.9925e+6
    bandwidth_hz: 8.0e+3
    location: {lat_deg: 13.476, lon_deg: 144.749, alt_m: 0.0, antenna_height_m: 10.0}
    emitter:
      eirp_dbw: 20.0
      antenna: {type: isotropic, gain_dbi: 0.0}
      pointing: omni
      bandwidth_hz: 8.0e+3
      waveform: noise
    use_as_reference: true

  - id: ref-sapporo
    name: Reference carrier, Sapporo city centre (illustrative)
    satellite_id: uhf-172e
    transponder_id: shared-2
    uplink_center_hz: 301.1175e+6
    bandwidth_hz: 8.0e+3
    location: {lat_deg: 43.062, lon_deg: 141.354, alt_m: 0.0, antenna_height_m: 10.0}
    emitter:
      eirp_dbw: 20.0
      antenna: {type: isotropic, gain_dbi: 0.0}
      pointing: omni
      bandwidth_hz: 8.0e+3
      waveform: noise
    use_as_reference: true

processing:
  region: {lat_min: -60.0, lat_max: 60.0, lon_min: 60.0, lon_max: -120.0}   # wraps the antimeridian
