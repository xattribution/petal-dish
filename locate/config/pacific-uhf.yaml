# PETAL Locate example configuration (default): legacy-UHF bent-pipe channels, Pacific.
#
# EVERYTHING NUMERIC HERE IS ILLUSTRATIVE: orbital slots are nominal, inclinations and
# phases are invented, the 25 kHz channel frequencies, translations and link numbers
# (G/T, SFD, saturated EIRP, noise temperatures, antenna gains, EIRPs) are placeholders
# chosen to give a plausible exercise, not data for any real spacecraft or terminal.
# Sites and reference locations are city-centre coordinates with neutral names; nothing
# here is a real facility.
#
# Frequency plan (uplink, MHz):       muos-pac    uhf-172e    muos-io
#   shared-1   301.000  (25 kHz)         x           x           x
#   shared-2   301.125  (25 kHz)         x           x           x
#   solo-pac   301.500  (25 kHz)         x
#   solo-172e  301.750  (25 kHz)                     x
#   solo-io    302.000  (25 kHz)                                 x
# An interferer on a "solo" channel is relayed by one satellite only: it can be
# detected and judged uplink or local, but there is no second satellite to locate it.
# muos-pac and muos-io share the -41.0 MHz translation (co-channel downlinks, about 120
# degrees apart in the sky seen from the Asian sites); uhf-172e uses -33.6 MHz.
version: 1
name: pacific-uhf
description: >-
  Illustrative legacy-UHF bent-pipe scenario over the Pacific: three satellites with
  25 kHz channels near 300 MHz uplink, seven city-centre monitoring sites and two
  reference carriers. All orbital slots, inclinations, channel frequencies,
  translations, link parameters, antennas and powers are illustrative placeholders,
  not data for any real system; no site or reference location is a real facility.
dut1_s: 0.0

satellites:
  - id: muos-pac
    name: MUOS Pacific (nominal 177 W)
    notes: >-
      Illustrative: nominal slot; inclination, phase, channel frequencies, the
      -41.0 MHz translation and the link numbers are placeholders.
    orbit: {type: geo, lon_deg: -177.0, inclination_deg: 5.0, phase_deg: 40.0, epoch: "2026-01-01T00:00:00Z"}
    transponders:
      - {id: shared-1, uplink_center_hz: 301.000e+6, bandwidth_hz: 25.0e+3, translation_hz: -41.0e+6,
         g_over_t_dbk: -14.0, sfd_dbw_m2: -136.0, eirp_sat_dbw: 26.0}
      - {id: shared-2, uplink_center_hz: 301.125e+6, bandwidth_hz: 25.0e+3, translation_hz: -41.0e+6,
         g_over_t_dbk: -14.0, sfd_dbw_m2: -136.0, eirp_sat_dbw: 26.0}
      - {id: solo-pac, uplink_center_hz: 301.500e+6, bandwidth_hz: 25.0e+3, translation_hz: -41.0e+6,
         g_over_t_dbk: -14.0, sfd_dbw_m2: -136.0, eirp_sat_dbw: 26.0}

  - id: uhf-172e
    name: UFO-class legacy UHF (nominal 172 E)
    notes: >-
      Illustrative: nominal slot; inclination, phase, channel frequencies, the
      -33.6 MHz translation and the link numbers are placeholders.
    orbit: {type: geo, lon_deg: 172.0, inclination_deg: 4.0, phase_deg: 200.0, epoch: "2026-01-01T00:00:00Z"}
    transponders:
      - {id: shared-1, uplink_center_hz: 301.000e+6, bandwidth_hz: 25.0e+3, translation_hz: -33.6e+6,
         g_over_t_dbk: -14.0, sfd_dbw_m2: -136.0, eirp_sat_dbw: 26.0}
      - {id: shared-2, uplink_center_hz: 301.125e+6, bandwidth_hz: 25.0e+3, translation_hz: -33.6e+6,
